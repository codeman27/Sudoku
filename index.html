<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku — The Quiet Journal</title>
  <meta name="description" content="A calm, paper-inspired Sudoku puzzle. Playable offline once loaded.">
  <meta name="theme-color" content="#f9f2e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="screen" id="app">
    <p id="storage-warning" role="alert" hidden>Saved progress or statistics are unavailable. Changes may not persist.</p>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">s</span> sudoku</div>
      <div class="diff-picker" role="radiogroup" aria-label="Difficulty" id="diff-picker">
        <button type="button" class="diff-btn" role="radio" aria-checked="true" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn" role="radio" aria-checked="false" data-diff="medium">Medium</button>
        <button type="button" class="diff-btn" role="radio" aria-checked="false" data-diff="hard">Hard</button>
      </div>
    </header>

    <section class="title">
      <p class="overline">daily puzzle</p>
      <h2>The quiet journal</h2>
      <p class="subtitle">Fill every row, column and box with 1 to 9.</p>
    </section>

    <div class="game-meta">
      <span class="badge" id="difficulty-badge">easy</span>
      <span class="timer" id="timer" role="timer" aria-label="Time elapsed">&#9719; 00:00</span>
    </div>

    <div class="board" id="board" role="grid" aria-label="Sudoku board, 9 by 9"></div>

    <div class="toolbar" role="toolbar" aria-label="Game tools">
      <button type="button" class="tool" id="tool-undo"><span class="tool-icon" aria-hidden="true">&#8630;</span>Undo</button>
      <button type="button" class="tool" id="tool-notes" aria-pressed="false"><span class="tool-icon" aria-hidden="true">&#9998;</span>Notes</button>
      <button type="button" class="tool" id="tool-erase"><span class="tool-icon" aria-hidden="true">&#9671;</span>Erase</button>
      <button type="button" class="tool" id="tool-hint"><span class="tool-icon" aria-hidden="true">&#10023;</span>Hint</button>
    </div>

    <div class="numbers" id="pad" role="group" aria-label="Number pad"></div>

    <footer class="footer">
      <span id="stats-line" aria-live="off"></span>
      <button type="button" class="new-game" id="new-game">New puzzle &#8601;</button>
      <span class="app-version">v1.0.0</span>
    </footer>

    <div class="sr-only" role="status" aria-live="polite" id="announce"></div>
  </main>

  <div class="overlay" id="win-overlay" hidden>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <p class="overline">puzzle solved</p>
      <h3 id="win-title">Nicely done.</h3>
      <p id="win-detail"></p>
      <div class="win-actions">
        <button type="button" class="btn-primary" id="win-new">New puzzle &#8601;</button>
        <button type="button" class="btn-ghost" id="win-close">Close</button>
      </div>
    </div>
  </div>

  <script src="js/sudoku.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
